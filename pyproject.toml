[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "indefinite-articles"
dynamic = ["version"]
description = "Daily article recommendations by email, trained on your replies with a local LLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["numpy"]

[project.scripts]
indefinite-articles = "indefinite_articles.cli:main"

[tool.setuptools.dynamic]
version = {attr = "indefinite_articles.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"indefinite_articles.mail" = ["templates/*"]
