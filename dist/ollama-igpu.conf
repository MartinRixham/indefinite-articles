# Installed by indefinite-articles: let Ollama use integrated GPUs such as the
# Radeon 890M (Ryzen AI 300). Without this Ollama skips them and runs on the CPU,
# and indefinite-articles refuses to start (require_gpu = true).
[Service]
Environment=OLLAMA_IGPU_ENABLE=1
# Ollama's default 4096-token context leaves little room for a scoring prompt
# (reader profile, examples and article; see llm.max_prompt_chars), and Ollama
# silently drops the start of an overlong prompt, which is where the profile is.
Environment=OLLAMA_CONTEXT_LENGTH=8192
