# Configuration for indefinite-articles(1). After editing:
#   sudo systemctl restart indefinite-articles
# Test with:
#   sudo -u indefinite-articles indefinite-articles check --send-test

[general]
database = "/var/lib/indefinite-articles/indefinite-articles.db"
digest_time = "07:00"            # local time, HH:MM
articles_per_digest = 10
exploration = 2                  # picks outside the top-ranked, so it keeps learning
max_per_source = 3               # avoid one feed dominating a digest
max_article_age_days = 3
max_candidates = 150             # articles per day that get full text + LLM scoring;
                                 # every other article is only ranked by embeddings
feeds_dir = "feeds.d"            # relative to this file
# exclude_categories = ["Sports", "Gaming", "Food & Cooking"]   # skip whole categories
fetch_concurrency = 16           # hosts fetched in parallel (one request at a time per host)
fetch_interval_minutes = 60
poll_interval_minutes = 5
fetch_full_articles = true       # download each candidate's page so the LLM sees the article text
article_chars = 1500             # characters of article text given to the LLM per article
fetch_workers = 4                # parallel page downloads
allow_private_addresses = false  # allow article links that point at LAN/localhost addresses

[profile]
# Starting description of your tastes. The service rewrites its own copy of this
# as you reply to digests (see `indefinite-articles profile`); editing it here only affects
# a fresh database.
interests = """
I like in-depth technical articles about software engineering, Linux, programming
languages and machine learning, plus well-researched science writing. I dislike
product announcements, celebrity news and listicles.
"""

[llm]
# Any OpenAI-compatible endpoint running locally.
#   Ollama:      sudo dnf install ollama && sudo systemctl enable --now ollama
#                ollama pull llama3.1:8b
#   llama.cpp:   llama-server -m model.gguf --port 8080   -> http://127.0.0.1:8080/v1
base_url = "http://127.0.0.1:11434/v1"
model = "llama3.1:8b"
api_key = ""
timeout_seconds = 600
embedding_model = "nomic-embed-text"   # first-pass ranking of every article:
                                       #   ollama pull nomic-embed-text
                                       # set to "" to disable (newest articles are used)
embedding_prefix = "clustering: "      # task prefix nomic-embed-text expects
batch_size = 8                   # max articles per scoring request
max_prompt_chars = 12000         # ~3k tokens; keep below the model's context window.
                                 # Ollama defaults to a 4096-token context; to use bigger
                                 # prompts set OLLAMA_CONTEXT_LENGTH=16384 for ollama.service
                                 # and raise this to ~50000.
temperature = 0.2

[email]
to = "you@example.com"           # where digests are sent; replies from here are read
from = "indefinite-articles@example.com"
# allowed_senders = ["you@example.com", "you@work.example"]   # default: [to]
send_acknowledgement = true      # reply with what was understood from your feedback

[email.smtp]
host = "smtp.example.com"
port = 587
security = "starttls"            # starttls | ssl | none
username = "indefinite-articles@example.com"
password = ""
# password_file = "/etc/indefinite-articles/smtp-password"   # alternative to password

[email.imap]
# The mailbox that receives your replies (the "from" account above).
host = "imap.example.com"
port = 993
security = "ssl"                 # ssl | starttls | none
username = "indefinite-articles@example.com"
password = ""
# password_file = "/etc/indefinite-articles/imap-password"
folder = "INBOX"
# processed_folder = "indefinite-articles"   # move handled replies here

# Feeds live in feeds.d/ next to this file (/etc/indefinite-articles/feeds.d/): any *.opml file
# (export one from another feed reader and drop it in) or *.txt file with one URL per
# line. default.opml ships with ~500 checked feeds in ~30 categories; edit it freely.
# Feeds can also be listed here:
#
# [[feeds]]
# name = "My favourite blog"
# url = "https://example.com/feed.xml"
# category = "Programming"
# max_items = 40
