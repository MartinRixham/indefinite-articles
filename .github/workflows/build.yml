name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }}${{ matrix.numpy && ', numpy' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        numpy: [false]
        include:
          # numpy is optional (speeds up the embedding pre-filter); test that path too.
          - python: "3.14"
            numpy: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install numpy
        if: matrix.numpy
        run: python -m pip install numpy

      - name: Run tests
        run: make test

  rpm:
    name: RPM (Fedora ${{ matrix.fedora }})
    needs: test
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
      env:
        LANG: C.UTF-8
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44"]
    steps:
      - name: Install build tools
        run: >
          dnf -y -q install rpm-build rpmlint python3-devel pyproject-rpm-macros
          systemd-rpm-macros python3-setuptools make tar

      - uses: actions/checkout@v5

      - name: Build RPM
        run: make rpm

      - name: Lint packages
        run: rpmlint -r packaging/indefinite-articles.rpmlintrc packaging/indefinite-articles.spec build/rpmbuild/RPMS/noarch/*.rpm build/rpmbuild/SRPMS/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: indefinite-articles-fc${{ matrix.fedora }}
          path: |
            build/rpmbuild/RPMS/noarch/*.rpm
            build/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error
